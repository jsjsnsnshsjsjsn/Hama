name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ArenaStrike.xcodeproj \
            -scheme ArenaStrike \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          APP_PATH="$(find ./DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "::error::No .app produced"; exit 1; fi
          rm -rf Payload ArenaStrike-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ArenaStrike-unsigned.ipa Payload
          ls -lh ArenaStrike-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ArenaStrike-IPA-unsigned
          path: ArenaStrike-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
