name: ArenaStrike
options:
  bundleIdPrefix: com.youraccount
  deploymentTarget:
    iOS: "17.0"
targets:
  ArenaStrike:
    type: application
    platform: iOS
    sources: [ArenaStrike]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Arena Strike
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "پێویستە بۆ یاری ١ڤ١ لەگەڵ هاوڕێ لە هەمان وایفای"
        NSBonjourServices:
          - _arena1v1._tcp
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youraccount.arenastrike
        PRODUCT_NAME: ArenaStrike
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
